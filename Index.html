<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moliyaviy Iqtisodiyot - Pro O'yin</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-light: #f8fafc;
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        /* Header & Timer */
        .header {
            grid-column: 1 / -1;
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(10px);
        }
        
        .timer-container {
            margin-top: 15px;
            height: 12px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: var(--success);
            transition: width 1s linear, background-color 0.5s;
        }
        
        .timer-text { font-size: 26px; font-weight: bold; margin-top: 10px; color: var(--success); }

        /* Teams Panel */
        .main-panel { display: flex; flex-direction: column; gap: 20px; }
        
        .teams {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .team-card {
            background: var(--card-bg);
            border: 2px solid var(--border-glass);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            transition: 0.3s;
            position: relative;
        }

        .team-card.active {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            background: rgba(30, 58, 138, 0.8);
        }
        
        .active-badge {
            display: none;
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .team-card.active .active-badge { display: block; }

        .team-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .team-score { font-size: 32px; font-weight: 900; color: var(--warning); margin-bottom: 10px; }
        
        .inventory-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .inv-item { background: #334155; padding: 3px 8px; border-radius: 6px; }

        .double-btn {
            background: linear-gradient(45deg, #f59e0b, #ea580c);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.2s;
        }
        .double-btn:hover:not(:disabled) { transform: scale(1.05); }
        .double-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
        .double-btn.active { box-shadow: 0 0 15px var(--warning); border: 2px solid white; }

        /* Question Box */
        .question-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            padding: 30px;
            border-radius: 16px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.5;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) { .options { grid-template-columns: 1fr; } }

        .option-btn {
            background: #1e293b;
            border: 2px solid #334155;
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.2);
        }

        .option-btn:disabled { cursor: not-allowed; }
        .option-btn.correct { background: var(--success) !important; border-color: var(--success) !important; color: white; font-weight: bold; }
        .option-btn.wrong { background: var(--danger) !important; border-color: var(--danger) !important; color: white; }

        .explanation {
            margin-top: 20px; padding: 15px; background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success); border-radius: 0 8px 8px 0;
            display: none; font-size: 15px; line-height: 1.5;
        }

        .next-btn {
            background: var(--primary); color: white; border: none; padding: 15px 30px;
            border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
            width: 100%; margin-top: 20px; display: none; transition: 0.2s;
        }
        .next-btn:hover { background: #2563eb; }

        /* Store Panel */
        .side-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            padding: 20px;
            border-radius: 16px;
            height: fit-content;
        }
        
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .market-item {
            background: #1e293b; border: 1px solid #334155; padding: 15px 10px;
            border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .market-item:hover { border-color: var(--warning); background: #334155; transform: translateY(-2px); }
        .market-icon { font-size: 24px; margin-bottom: 5px; }
        .market-name { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .market-cost { color: var(--danger); font-size: 14px; font-weight: bold; background: rgba(239, 68, 68, 0.2); padding: 2px 8px; border-radius: 12px; }

        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; }
            .teams { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Moliyaviy Iqtisodiyot: Boshqaruv O'yini</h1>
        <p style="opacity: 0.8; margin-top: 5px;">30 ta Vaziyat | 60 soniya | Davlat qurish strategiyasi</p>
        <div class="timer-text" id="timer-text">60</div>
        <div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
    </div>

    <div class="main-panel">
        <div class="teams" id="teams-container">
            <!-- JS orqali chiziladi -->
        </div>

        <div class="question-panel">
            <div style="display: flex; justify-content: space-between; color: #94a3b8; margin-bottom: 15px; font-weight: bold;">
                <span id="q-counter">Savol: 1 / 30</span>
                <span id="active-multiplier" style="color: var(--warning); display: none;">🔥 2X BALL YONIQ!</span>
            </div>
            <div class="question-text" id="q-text">Savol yuklanmoqda...</div>
            <div class="options" id="options-container"></div>
            <div class="explanation" id="explanation-box"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Keyingi navbat ➔</button>
        </div>
    </div>

    <div class="side-panel">
        <h3 style="color: var(--primary); text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px;">🏛️ Iqtisodiy Do'kon</h3>
        <p style="font-size: 12px; color: #94a3b8; text-align: center; margin-top: 10px;">To'plangan ballar hisobidan xarid qiling</p>
        <div class="market-grid" id="market-container">
            <!-- Do'kon elementlari JS orqali -->
        </div>
    </div>
</div>

<script>
    // 3 ta Jamoa
    const teams = [
        { id: 0, name: "Investitsiya (1)", score: 0, inventory: [], hasDouble: true, doubleActive: false },
        { id: 1, name: "Moliya (2)", score: 0, inventory: [], hasDouble: true, doubleActive: false },
        { id: 2, name: "Bank (3)", score: 0, inventory: [], hasDouble: true, doubleActive: false }
    ];

    // Do'kon
    const marketItems = [
        { id: "m1", name: "Davlat Nomi", cost: 40, icon: "🇺🇿" },
        { id: "m2", name: "Prezident", cost: 30, icon: "👔" },
        { id: "m3", name: "Oliy Majlis", cost: 25, icon: "🏛️" },
        { id: "m4", name: "Markaziy Bank", cost: 20, icon: "🏦" },
        { id: "m5", name: "Moliya Vazirligi", cost: 20, icon: "💼" },
        { id: "m6", name: "Milliy Armiya", cost: 15, icon: "🛡️" },
        { id: "m7", name: "Bojxona", cost: 15, icon: "🛃" },
        { id: "m8", name: "Temir Yo'l", cost: 15, icon: "🚆" }
    ];

    // M1-M7 modullar bo'yicha 30 ta savol
    const rawQuestions = [
        { q: "Moliya fani nima bilan shug'ullanadi?", opts: ["Pul mablag'larini va aktivlarni vaqt hamda noaniqlik sharoitida qanday taqsimlashni o'rganadi", "Faqat davlat soliqlarini yig'ish jarayoni", "Tovar va xizmatlarni texnik ishlab chiqarish", "Faqat buxgalteriya hisobotlarini yozish"], a: 0, exp: "Moliya – vaqt o'tishi bilan pullar qanday boshqarilishi va risklar sharoitida mablag'lar qanday taqsimlanishi haqidagi fandir." },
        { q: "Nima uchun moliyani o'rganamiz?", opts: ["Resurslarni vaqt va tavakkalchilik (risk) sharoitida oqilona taqsimlashni o'rganish uchun", "Faqat bankomatdan pul yechishni bilish uchun", "Kompaniyada mahsulot qadog'ini dizayn qilish uchun", "Davlatsiz yashash tizimini yaratish uchun"], a: 0, exp: "Moliya orqali insonlar va firmalar o'z resurslarini samarali, vaqt va xatarlarni hisobga olgan holda boshqarishadi." },
        { q: "Moliyaviy qarorlar qabul qilish asosan qanday sharoitda amalga oshadi?", opts: ["Noaniqlik va risk sharoitida", "Mutlaq kafolatlangan va xatarsiz sharoitda", "Faqat inflyatsiya nol bo'lgan holatda", "Xalqaro qoidalar man etgan sharoitda"], a: 0, exp: "Kelajakdagi natijalar aniq bo'lmagani uchun barcha moliyaviy qarorlar ma'lum bir noaniqlik va risk (xatar) ostida olinadi." },
        { q: "Moliyaning fundamental tamoyillaridan biri qaysi?", opts: ["Pulning vaqt qiymati (Time Value of Money)", "Har qanday xarajat qoplanishi shartligi", "Faqat naqd pul bilan savdo qilish", "Xavfni to'liq nolga tushirish majburiyati"], a: 0, exp: "Pulning vaqt qiymati, ya'ni bugungi pul ertangi xuddi shunday miqdordagi puldan qadrliroq ekanligi moliyaning asosiy tamoyilidir." },
        
        { q: "Moliyaviy tizimning asosiy funksiyasi nima?", opts: ["Jamg'armalarga ega bo'lgan subyektlar mablag'larini investitsiya kerak bo'lganlarga yo'naltirish", "Davlat chegaralarini qo'riqlash", "Faqat naqd pul bosib chiqarish", "Xalqaro savdo qoidalarini belgilash"], a: 0, exp: "Moliyaviy tizimning bosh vazifasi - mablag'i ko'plardan pulni olib, pulga muhtoj (investitsiya qiluvchi)larga yetkazib berishdir." },
        { q: "Quyidagilardan qaysi biri moliyaviy institut hisoblanadi?", opts: ["Tijorat banki va sug'urta kompaniyasi", "Savdo supermarketi", "Qurilish kompaniyasi", "Transport logistika markazi"], a: 0, exp: "Banklar, sug'urta kompaniyalari va investitsiya fondlari moliyaviy tizim institutlari sanaladi." },
        { q: "Moliyaviy tizimdagi funksional yondashuv nima?", opts: ["Institutlar va texnologiyalar o'zgarsa ham, moliyaning asosiy funksiyalari barqaror qolishini ko'rsatadi", "Moliyaviy funksiyalar har yili o'zgarib turishini aytadi", "Davlat boshqaruvi tizimiga tegishli qoida", "Banklar keraksiz ekanligini tasdiqlaydi"], a: 0, exp: "Funksional yondashuvga ko'ra, moliya bozorlari va institutlari o'zgarishi mumkin, lekin ularning bajaradigan funksiyasi (qarz berish, to'lov qilish) o'zgarmaydi." },
        { q: "Moliyaviy innovatsiyalarga (M2) misol keltiring.", opts: ["Elektron to'lov tizimlari va mobil banking", "Zavodlarda yangi dastgoh o'rnatish", "Oziq-ovqat mahsulotlari retseptining o'zgarishi", "Talabalarga yangi kitoblar tarqatish"], a: 0, exp: "Moliyaviy xizmatlar sohasidagi texnologik va tizimli yangiliklar (masalan, kriptovalyuta, mobil to'lovlar) moliyaviy innovatsiyalardir." },
        
        { q: "Pulning vaqt qiymati tamoyiliga ko'ra:", opts: ["Bugungi 100 ming so'm kelajakdagi 100 ming so'mdan qimmatliroq", "Ertangi 100 ming bugungidan qadrliroq", "Vaqt o'tishi bilan pul faqat qimmatlashadi", "Pulning narxi doim barqaror bo'ladi"], a: 0, exp: "Bugungi pulni investitsiya qilib foyda (foiz) olish mumkinligi sababli, uning joriy qiymati kelajakdagi aynan shuncha summadan yuqori bo'ladi." },
        { q: "Diskontlash amaliyoti nimani anglatadi?", opts: ["Kelajakdagi pul oqimlarining bugungi (joriy) qiymatini hisoblash", "Pulni bankka foizga qo'yib ko'paytirish", "Tovar narxini arzonlashtirib sotish", "Soliqlarni kechiktirib to'lash"], a: 0, exp: "Diskontlash – ma'lum foiz stavkasi orqali kelajakda olinadigan mablag'ning hozirgi paytdagi qadrini (PV) aniqlashdir." },
        { q: "Sof joriy qiymat (NPV) ijobiy (noldan katta) bo'lsa, qanday moliyaviy qaror qabul qilinadi?", opts: ["Investitsion loyiha qabul qilinadi (foydali)", "Loyiha rad etiladi (zararli)", "Foyda va zarar nolga teng hisoblanadi", "Qaror qabul qilish noma'lum muddatga qoldiriladi"], a: 0, exp: "Agar loyihadan keladigan pul oqimlarining joriy qiymati kiritilgan sarmoyadan ko'p bo'lsa (NPV>0), u iqtisodiy jihatdan foydali sanaladi." },
        { q: "Annuitet tushunchasi nimani anglatadi?", opts: ["Ma'lum vaqt davomida bir xil miqdorda, muntazam oraliqda to'lanadigan pul oqimlari (masalan, ijara yoki kredit to'lovi)", "Aksiyalar narxining bir kunda keskin ko'tarilishi", "Korxonaning bankrotlik jarayoni", "Davlatdan olinadigan bir martalik subsidiya"], a: 0, exp: "Muntazam ravishda bir xil oraliqda amalga oshiriladigan bir xil miqdordagi to'lovlar qatori annuitet deyiladi." },
        { q: "Bozor narxlarining aktivlarni baholashdagi roli qanday?", opts: ["Bozordagi talab va taklif orqali shakllangan narx aktivning haqiqiy moliyaviy qadrini ko'rsatib beradi", "Narxlar aktivlarning qadrini doim pasaytiradi", "Aktivlarning narxi faqat davlat tomonidan belgilanadi", "Bozor narxi baholashda umuman rol o'ynamaydi"], a: 0, exp: "Raqobatbardosh bozorlarda aktivlarning narxi mavjud axborotlar va investorlarning baholashlari yig'indisini aks ettiradi." },

        { q: "Personal (shaxsiy) moliya asosan nimalarni tahlil qiladi?", opts: ["Jismoniy shaxs yoki oilaning daromadlari, xarajatlari va jamg'armalarini", "Katta davlat byudjeti taqchilligini", "Xalqaro valyuta fondining kredit siyosatini", "Korporatsiyalarning yillik moliyaviy hisobotini"], a: 0, exp: "Shaxsiy moliya insonlarning butun hayoti davomidagi iqtisodiy qarorlarini (daromad, pensiya, jamg'arma) o'rganadi." },
        { q: "Uy xo'jaligi balansida nimalar aks etadi?", opts: ["Oilaga tegishli bo'lgan aktivlar (mol-mulk) va majburiyatlar (qarzlar)", "Faqat bir oylik maosh va oziq-ovqat xarajatlari", "Davlat oldidagi faqat soliq majburiyatlari", "Qarindoshlarning daromadlari va ularning yoshi"], a: 0, exp: "Korxona balansi kabi, uy xo'jaligi balansi ham oilaning jamg'argan boyligi (aktivlari) va qarzlarini (majburiyatlarini) solishtiradi." },
        { q: "Hayot davri (Life-cycle) tahliliga ko'ra insonlar qanday moliyaviy xulq-atvorga ega bo'lishadi?", opts: ["Yoshlikda qarz oladi, o'rta yoshda jamg'aradi, qarilikda jamg'armasini ishlatadi", "Faqat pensiya yoshida ishlashadi va qarz olishadi", "Hech qachon jamg'arma qilishmaydi", "Daromadi qancha bo'lsa, hammasini o'sha kuni sarflaydi"], a: 0, exp: "Bu nazariyaga ko'ra, odamlar butun hayoti davomida iste'molini barqaror ushlab turish uchun daromadlariga qarab qarz oladi va jamg'aradi." },
        { q: "Ta'limga qilingan xarajat moliyaviy tahlilda qanday baholanadi?", opts: ["Inson kapitaliga qilingan kelajakda daromad keltiruvchi uzoq muddatli investitsiya sifatida", "Faqat sof zarar va majburiyat sifatida", "Qisqa muddatli chayqovchilik sifatida", "Soliqlardan qochish usuli sifatida"], a: 0, exp: "Ta'lim (o'qish) shaxsning kelajakdagi maoshini (daromadini) oshirishi sababli, u kapital investitsiya hisoblanadi." },

        { q: "Qarz moliyaviy instrumentlariga qaysilar kiradi?", opts: ["Obligatsiyalar va bank kreditlari", "Faqat oddiy aksiyalar", "Oltin va kumush tangalar", "Kompaniya direktorlari kengashi qarorlari"], a: 0, exp: "Qarz instrumentlari shunday qog'ozlar yoki shartnomalarki, unda qarz oluvchi qarz beruvchiga ma'lum muddatda asosiy qarz va foizlarni to'lashi shart bo'ladi." },
        { q: "Ulushli (Equity) moliyaviy instrumentning asosiy xususiyati nima?", opts: ["Egasi kompaniya mulkida ulushga va foydadan dividend olish huquqiga ega bo'ladi (Aksiyalar)", "Egasi kompaniyadan har oy qat'iy foiz olishi kafolatlanadi", "Kompaniya bankrot bo'lsa puli birinchi bo'lib qaytariladi", "Ulushli vositalar faqat hukumat tomonidan chiqariladi"], a: 0, exp: "Ulush (masalan, aksiya) egasiga korxona foydasidan ulush (dividend) olish va korxonani boshqarishda qatnashish huquqini beradi." },
        { q: "Hosilaviy (Derivativ) instrumentlar nima uchun ko'proq ishlatiladi?", opts: ["Kelajakdagi narx o'zgarishi xatarlaridan himoyalanish (xedjirlash) yoki spekulyatsiya uchun", "Bankdan uzoq muddatli iste'mol krediti olish uchun", "Davlat byudjetini tasdiqlash uchun", "Buxgalteriya hisobotlarini kamaytirish uchun"], a: 0, exp: "Derivativlar (fyuchers, opsion) qiymati boshqa bir bazaviy aktiv (valyuta, neft) narxiga bog'liq bo'lib, narx tebranishlaridan qutulish uchun ishlatiladi." },
        { q: "Foiz stavkalarining vaqt tuzilmasi (Term structure of interest rates) nimani ifodalaydi?", opts: ["Turli muddatga berilgan (masalan, 1 yillik va 10 yillik) qarz qog'ozlari foiz stavkalari o'rtasidagi bog'liqlikni", "Bir kunda aksiyalar narxining qanchaga o'zgarganini", "Banklarning ishlash soatlarini", "Faqat chet el valyutasi kurslarini"], a: 0, exp: "Vaqt tuzilmasi (daromadlilik egri chizig'i) qarzning to'lanish muddati uzaygani sari uning foiz stavkasi qanday o'zgarishini ko'rsatadi." },
        { q: "Hisob birligining inflyatsiya tufayli o'zgarishi foiz stavkasiga qanday ta'sir qiladi?", opts: ["Nominal foiz o'zgarmasa ham, pullar qadrsizlangani uchun haqiqiy (real) foiz daromadi pasayadi", "Real daromad inflyatsiya sababli keskin oshib ketadi", "Qarz oluvchilarga jiddiy zarar yetkazadi", "Inflyatsiya foizlarga umuman ta'sir qilmaydi"], a: 0, exp: "Fisher formulasiga ko'ra, Real foiz stavkasi = Nominal foiz - Inflyatsiya. Demak inflyatsiya oshsa, real daromad tushadi." },

        { q: "Moliyaviy risk (xatar) deganda nima tushuniladi?", opts: ["Kutilgan moliyaviy natijaning o'zgaruvchanligi yoki pul yo'qotish ehtimoli", "Investitsiyaning har doim foyda bilan yakunlanishi kafolati", "Bankdagi pulning davlat tomonidan sug'urtalanishi", "Moliyaviy qarorlarning to'liq bekor qilinishi"], a: 0, exp: "Risk – sarmoyadan olinadigan amaliy dar
